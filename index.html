<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080704">
  <title>ORACASINO — Member Terpilih Jackpot</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<div class="app-shell table-only-shell">
  <main class="main-content table-only-content">
    <section class="page active" id="page-dashboard">
      <section class="panel table-panel">
        <div class="panel-title"><i class="fa-solid fa-list"></i> Member Terpilih Jackpot</div>
        <div class="table-tools">
          <input id="searchInput" type="search" placeholder="Cari nomor WhatsApp..." aria-label="Cari nomor WhatsApp">
          <select id="filterType" aria-label="Filter jenis jackpot">
            <option value="">Semua Jackpot</option><option>Jackpot Utama</option><option>Jackpot Harian</option><option>Jackpot Mingguan</option><option>Jackpot Bulanan</option>
          </select>
          <select id="filterStatus" aria-label="Filter status">
            <option value="">Semua Status</option><option>MENUNGGU REGISTRASI</option><option>BERHASIL</option><option>GAGAL KLAIM</option>
          </select>
        </div>
        <div class="table-wrap">
          <table class="member-table">
            <colgroup><col class="c-no"><col class="c-phone"><col class="c-type"><col class="c-amount"><col class="c-status"><col class="c-claim"><col class="c-action"></colgroup>
            <thead><tr><th>No</th><th>WhatsApp</th><th>Jenis Jackpot</th><th>Nominal Deposit</th><th>Status Klaim</th><th>Jumlah Klaim</th><th>Aksi</th></tr></thead>
            <tbody id="memberRows"></tbody>
          </table>
        </div>
        <div class="table-foot">
          <span id="recordCount">0 member</span>
          <div class="pagination"><button id="prevPage" aria-label="Sebelumnya">‹</button><span id="pageInfo">1 / 1</span><button id="nextPage" aria-label="Berikutnya">›</button></div>
        </div>
      </section>
      <section class="warning-panel" id="warningPanel">
        <div class="warning-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <div class="warning-copy"><b>PERHATIAN!</b><div id="warningText"></div></div>
        <button class="gold-button room-button" id="viewRoomBtn"><i class="fa-brands fa-whatsapp"></i> Hubungi WhatsApp</button>
      </section>
      <div class="add-member-bottom-wrap">
        <button class="gold-button add-member-bottom" id="openAddMember" type="button"><i class="fa-solid fa-plus"></i> TAMBAH MEMBER</button>
      </div>
    </section>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head"><h2 id="modalTitle">Detail Member</h2><button id="closeModal" class="close-btn" type="button">×</button></div>
    <form id="editForm">
      <input type="hidden" id="editId">
      <label>Nomor WhatsApp<input id="editPhone" required></label>
      <label>Jenis Jackpot<select id="editType"><option>Jackpot Utama</option><option>Jackpot Harian</option><option>Jackpot Mingguan</option><option>Jackpot Bulanan</option></select></label>
      <label>Nominal Deposit<input id="editAmount" inputmode="numeric"></label>
      <label>Status Klaim<select id="editStatus"><option>MENUNGGU REGISTRASI</option><option>BERHASIL</option><option>GAGAL KLAIM</option></select></label>
      <label>Jumlah Klaim<input id="editClaim" inputmode="numeric"></label>
      <div class="modal-actions"><button type="button" class="dark-button" id="cancelEdit">Batal</button><button class="gold-button" type="submit">Simpan Perubahan</button></div>
    </form>
  </div>
</div>
<div class="modal-backdrop" id="addModalBackdrop">
  <div class="modal">
    <div class="modal-head"><h2>Tambah Member Baru</h2><button id="closeAddModal" class="close-btn" type="button">×</button></div>
    <form id="addForm">
      <label>Nomor WhatsApp<input id="addPhone" type="text" placeholder="08xxxxxxxxxx" required></label>
      <label>Jenis Jackpot<select id="addType"><option>Jackpot Utama</option><option>Jackpot Harian</option><option>Jackpot Mingguan</option><option>Jackpot Bulanan</option></select></label>
      <label>Nominal Deposit<input id="addAmount" inputmode="numeric" placeholder="Contoh: 50000"></label>
      <label>Status Klaim<select id="addStatus"><option>MENUNGGU REGISTRASI</option><option>BERHASIL</option><option>GAGAL KLAIM</option></select></label>
      <label>Jumlah Klaim<input id="addClaim" inputmode="numeric" placeholder="Contoh: 1500000"></label>
      <div class="modal-actions"><button type="button" class="dark-button" id="cancelAdd">Batal</button><button class="gold-button" type="submit">Tambah Member</button></div>
    </form>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="script.js"></script>
</body>
</html>
